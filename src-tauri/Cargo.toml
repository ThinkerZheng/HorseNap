[package]
name = "homenap"
version = "0.1.0"
description = "HorseNap - 工位暂离告示牌"
authors = ["HorseNap Contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# §23：SVG 消毒用成熟库（白名单机制）。需求原文指定的 sanitize-svg 已从 crates.io 消失，
# 采用同类维护活跃的 svg-hush（resvg 作者）替代
svg-hush = "0.9"

# Windows 电源保持（SetThreadExecutionState）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Power"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
